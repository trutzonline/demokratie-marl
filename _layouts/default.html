<!doctype html>
<html lang="{{ site.lang | default: 'de' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preload" href="{{ '/assets/fonts/fredoka-latin-600-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#ffffff">
</head>
<body>
  <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>
  {% include header.html %}
  <main id="inhalt" class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
